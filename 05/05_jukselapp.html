<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5. Desember - SleighPaden Kart</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map {
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

    <script>
        // Lag kartet
        var map = L.map('map').setView([58.1467, 7.9956], 13); // Sentrer kartet på Kristiansand, Agder

        // Legg til basemap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: 'Map data &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Legg til WMS-lag
        const wmsLayer = L.tileLayer.wms('https://openwms.statkart.no/skwms1/wms.spr_strandsoner?', {
            layers: 'spr_strandsoner_wms',
            format: 'image/png',
            transparent: true,
            attribution: 'Kartdata &copy; <a href="https://www.kartverket.no">Kartverket</a>'
        }).addTo(map);

    </script>
</body>
</html>
