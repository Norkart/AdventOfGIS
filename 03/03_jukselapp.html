<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet Kart</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        #map {
            height: 100vh;
        }
    </style>
</head>
<body>
    <h1>SleighPaden</h1>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([58.1467, 7.9956], 13); // Sentrer kartet på Kristiansand, Agder

        // Legg til OpenStreetMap bakgrunnskart
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap bidragsytere'
        }).addTo(map);

        // Andre bakgrunnskart du kan bruke:

        // }).addTo(map);

        // L.tileLayer('https://tiles.stadiamaps.com/tiles/stamen_toner/{z}/{x}/{y}.png', {

        // }).addTo(map);

        
    </script>
</body>
</html>
